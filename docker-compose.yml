services:
  db:
    image: postgres:15
    container_name: sacarf_db
    environment:
      POSTGRES_DB: ${DB_NAME:-sacarf_db}
      POSTGRES_USER: ${DB_USER:-sacarf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sacarf_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sacarf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sacarf_user} -d ${DB_NAME:-sacarf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  init:
    build: .
    container_name: sacarf_init
    volumes:
      - ./:/app
    environment: &common_env
      SERVICE_NAME: init
      SERVICE_PORT: 8000
      DB_NAME: ${DB_NAME:-sacarf_db}
      DB_USER: ${DB_USER:-sacarf_user}
      DB_PASSWORD: ${DB_PASSWORD:-sacarf_2026}
      DB_HOST: db
      DB_PORT: 5432
      DB_ENGINE: django.db.backends.postgresql
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-prod}
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      PYTHONPATH: /app:/app/sacarf
      GATEWAY_URL: http://gateway:80
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-josephsebastiannq@gmail.com}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-SACARF}
      # ── Monitoreo (nuevo) ──────────────────────────────────────────

      PROMETHEUS_URL: http://prometheus:9090

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - sacarf_network

  usuario-service:
    build: .
    container_name: sacarf_usuario
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      <<: *common_env
      SERVICE_NAME: usuario
      SERVICE_PORT: 8001
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sacarf_network

  academico-service:
    build: .
    container_name: sacarf_academico
    volumes:
      - ./:/app
    ports:
      - "8002:8002"
    environment:
      <<: *common_env
      SERVICE_NAME: academico
      SERVICE_PORT: 8002
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sacarf_network

  asistencia-service:
    build: .
    container_name: sacarf_asistencia
    volumes:
      - ./:/app
    ports:
      - "8003:8003"
    environment:
      <<: *common_env
      SERVICE_NAME: asistencia
      SERVICE_PORT: 8003
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sacarf_network

  reportes-service:
    build: .
    container_name: sacarf_reportes
    volumes:
      - ./:/app
    ports:
      - "8004:8004"
    environment:
      <<: *common_env
      SERVICE_NAME: reportes
      SERVICE_PORT: 8004
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sacarf_network

  # ── Monitoreo (nuevo) ────────────────────────────────────────────────

  # Reemplaza a prometheus + node-exporter + cadvisor + postgres-exporter:
  # este único contenedor lee CPU/RAM/disco con psutil, contenedores Docker
  # con el SDK oficial, y Postgres con SQL directo — por eso monta el
  # socket de Docker y el /proc, /sys y raíz del HOST de solo lectura.

  monitoring-service:
    build: .
    container_name: sacarf_monitoring
    volumes:
      - ./:/app

      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro

    ports:
      - "8005:8005"
    environment:
      <<: *common_env
      SERVICE_NAME: monitoring
      SERVICE_PORT: 8005
    depends_on:
      init:
        condition: service_completed_successfully

      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - sacarf_network

  gateway:
    build: ./gateway
    container_name: sacarf_gateway
    ports:
      - "8000:80"
    depends_on:
      - usuario-service
      - academico-service
      - asistencia-service
      - reportes-service
      - monitoring-service

    networks:
      - sacarf_network

  # ── Stack de monitoreo (nuevo) ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sacarf_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - sacarf_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sacarf_node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - sacarf_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sacarf_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sacarf_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: sacarf_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-sacarf_user}:${DB_PASSWORD:-sacarf_2026}@db:5432/${DB_NAME:-sacarf_db}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

    networks:
      - sacarf_network

volumes:
  postgres_data:
  prometheus_data:

networks:
  sacarf_network:
    driver: bridge
