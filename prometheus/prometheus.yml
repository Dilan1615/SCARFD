global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Microservicios Django SACARF (django-prometheus expone /metrics)
  - job_name: 'usuario'
    metrics_path: /metrics
    static_configs:
      - targets: ['usuario-service:8001']

  - job_name: 'academico'
    metrics_path: /metrics
    static_configs:
      - targets: ['academico-service:8002']

  - job_name: 'asistencia'
    metrics_path: /metrics
    static_configs:
      - targets: ['asistencia-service:8003']

  - job_name: 'reportes'
    metrics_path: /metrics
    static_configs:
      - targets: ['reportes-service:8004']

  - job_name: 'monitoring'
    metrics_path: /metrics
    static_configs:
      - targets: ['monitoring-service:8005']

  # Host: CPU, RAM, disco
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Contenedores Docker
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL: conexiones, transacciones, tamaño de BD
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
